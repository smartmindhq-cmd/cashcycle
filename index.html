  <!-- iPhone 15 Pro / 15 / 14 Pro -->

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body,#root{
      height:100%;height:-webkit-fill-available;width:100%;overflow:hidden;
      background:#ffffff;
      font-family:-apple-system,BlinkMacSystemFont,'Inter',system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;
      overscroll-behavior:none;
      -webkit-user-select:none;user-select:none;
      touch-action:pan-x pan-y;
    }
    /* Prevent iOS zoom on input focus — font-size must be ≥ 16px */
    input,textarea,select{font-size:16px;-webkit-user-select:auto;user-select:auto;}
    /* Smooth momentum scrolling on all scrollable areas */
    .overflow-y-auto,.overflow-y-scroll{-webkit-overflow-scrolling:touch;}
    /* Hide scrollbars but keep scrolling */
    ::-webkit-scrollbar{display:none;}
    /* Native-feel button press */
    button{-webkit-touch-callout:none;touch-action:manipulation;}
    @keyframes slideIn{from{transform:translateX(-100%)}to{transform:translateX(0)}}
    @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>

    function PrimaryBtn({children,onClick,disabled}){return(<button onClick={onClick} disabled={disabled} className={cx("flex items-center justify-center gap-2 rounded-full px-8 py-4 font-bold text-white transition active:scale-95",disabled?"bg-slate-300":"bg-blue-500 hover:bg-blue-600 shadow-lg shadow-blue-500/30")}>{children}</button>);}
    function Check({on}){return(<span className={cx("flex h-7 w-7 items-center justify-center rounded-full text-white text-sm transition",on?"bg-blue-500":"bg-slate-200 text-transparent")}>✓</span>);}
    function Toggle({on,onClick}){return(<button onClick={onClick} className={cx("h-8 w-14 rounded-full p-1 transition",on?"bg-blue-500":"bg-slate-300")}><div className={cx("h-6 w-6 rounded-full bg-white transition",on&&"translate-x-6")}/></button>);}
    function Row({l,sub,r}){return(<div className="flex items-center justify-between py-4"><div><div className="font-bold text-slate-900">{l}</div>{sub&&<div className="text-sm text-slate-500">{sub}</div>}</div><span className="text-slate-400">{r}</span></div>);}
    function ToggleRow({l,sub,on,set}){return(<div className="flex items-center justify-between py-4"><div className="flex-1 pr-3"><div className="font-bold text-slate-900">{l}</div>{sub&&<div className="text-sm text-slate-500">{sub}</div>}</div><Toggle on={on} onClick={()=>set(!on)}/></div>);}
    function Sheet2({title,sub,children,footer,scroll=true,onClose}){
      const ref=useRef(null);
      useEffect(()=>{
        if(!onClose||!ref.current)return;
        const el=ref.current;let sx=0,sy=0;
        const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
        const te=e=>{const ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY;const dx=ex-sx,dy=ey-sy;if(dx>60&&Math.abs(dy)<100)onClose();if(dy>80&&Math.abs(dx)<100)onClose();};
        el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});
        return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};
      },[onClose]);
      return(<div ref={ref} className="absolute inset-0 z-30 flex flex-col justify-end bg-black/30">
        <div className="flex max-h-[92%] flex-col rounded-t-[36px] bg-white px-5 pt-6" style={{paddingBottom:"calc(env(safe-area-inset-bottom,10px) + 8px)"}}>

          <div className="mt-4 flex gap-3">{footer}</div>
        </div>

    function TabBar({onInsights,balance,openAdd}){
      const {tab,setTab}=useContext(TabCtx);
      const items=[["home","📅"],["history","🕐"],["add","+"],["debt","⊞"],["goals","💳"]];

        <div className="flex items-center justify-around px-4 pt-3">
          {items.map(([k,ic])=>k==="add"?(

            <button key={k} onClick={()=>k==="insights"?onInsights?.():setTab(k)} className={cx("grid h-11 w-11 place-items-center rounded-full text-xl",tab===k?"text-blue-500":"text-slate-400")}>{ic}</button>

        </div>
        {balance&&<div className="absolute bottom-full left-3 mb-2"><button className="flex items-center gap-1 rounded-full border border-emerald-200 bg-white px-3 py-1.5 text-sm font-bold text-slate-800 shadow-md">{balance} <span className="text-emerald-500">🌿</span></button></div>}

    function GridIcon(){return<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">{[5,12,19].map(x=>[5,12,19].map(y=><circle key={`${x}-${y}`} cx={x} cy={y} r="1.6"/>))}</svg>;}

    // ── CalendarHome ──────────────────────────────────────
    const DAY_HEADERS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    function DayCell({day,blank,isToday,dayEvents}){
      if(blank)return<div className="min-h-[72px] border-b border-r border-slate-100"/>;
      const evs=dayEvents||[];
      const income=evs.filter(e=>e.amt>0).reduce((s,e)=>s+e.amt,0);
      const spent=evs.filter(e=>e.amt<0).reduce((s,e)=>s+Math.abs(e.amt),0);
      return(<div className={cx("min-h-[72px] border-b border-r border-slate-100 p-1",isToday&&"bg-blue-50/40")}>
        <div className={cx("mb-0.5 grid h-6 w-6 place-items-center rounded-full text-[11px] font-bold",isToday?"bg-blue-500 text-white":"text-slate-700")}>{day}</div>
        {income>0&&<div className="text-[8px] font-bold text-emerald-500 leading-none mb-0.5">+{fmt(income)}</div>}
        {spent>0&&<div className="text-[8px] font-bold text-rose-400 leading-none mb-0.5">-{fmt(spent)}</div>}
        <div className="space-y-0.5">{evs.slice(0,3).map((e,k)=>(<div key={k} className={cx("rounded border-l-2 px-1 py-0.5 text-[8px] leading-tight",e.color)}><div className="truncate font-semibold">{e.emoji} {e.label}</div></div>))}{evs.length>3&&<div className="text-[7px] text-slate-400 font-semibold pl-1">+{evs.length-3} more</div>}</div>
      </div>);
    }
    function CalendarHome({openMenu,openCash,openInsights,openWeather,openAdd,calendarEvents={},today="$0",balanceDisplay="$0",userName=""}){
      const [viewDate,setViewDate]=useState(new Date());
      const year=viewDate.getFullYear(),month=viewDate.getMonth();
      const firstDayRaw=new Date(year,month,1).getDay();
      const firstDay=(firstDayRaw+6)%7;
      const daysInMonth=new Date(year,month+1,0).getDate();
      const monthLabel=viewDate.toLocaleString("default",{month:"long",year:"numeric"});
      const changeMonth=o=>setViewDate(new Date(year,month+o,1));
      const now=new Date(),isCurrentMonth=now.getFullYear()===year&&now.getMonth()===month;
      const cells=[];
      for(let i=0;i<firstDay;i++)cells.push({blank:true});
      for(let d=1;d<=daysInMonth;d++)cells.push({day:d});
      // Build per-month events: for non-current months, filter by month index
      const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const viewMonthKey=MONTH_NAMES[month];
      const viewEvents=isCurrentMonth?calendarEvents:(calendarEvents.__all__||{});
      return(<div className="flex h-full flex-col">
        <TopBar today={today} openMenu={openMenu} openCash={openCash} openInsights={openInsights} openWeather={openWeather}/>
        <div className="mx-3 mb-1 rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-2.5">
          <div className="flex items-center justify-between">
            <span className="flex items-center gap-1.5 text-sm font-bold text-emerald-700">☀️ Clear Skies</span>
            <button onClick={openWeather} className="rounded-lg border border-emerald-200 bg-white px-2.5 py-0.5 text-xs font-semibold text-emerald-600">Edit</button>
          </div>
          <p className="mt-0.5 text-xs leading-snug text-emerald-700">{userName?"Hey "+userName+"! ":""}Balance: <b>{balanceDisplay}</b> — tap 💰 for breakdown</p>
        </div>
        <div className="flex items-center justify-center gap-3 py-1">
          <button onClick={()=>changeMonth(-1)} className="px-2 text-lg text-slate-400">‹</button>
          <span className="text-sm font-bold text-slate-700">{monthLabel} ▾</span>
          <button onClick={()=>changeMonth(1)} className="px-2 text-lg text-slate-400">›</button>
        </div>
        <div className="flex-1 relative min-h-0">
          <div className="absolute inset-0 overflow-y-auto" style={{paddingBottom:"82px"}}>
            <div className="grid grid-cols-7">
              {DAY_HEADERS.map(h=><div key={h} className="border-b border-slate-200 py-1 text-center text-[10px] font-semibold text-slate-400">{h}</div>)}
              {cells.map((c,i)=><DayCell key={i} {...c} isToday={isCurrentMonth&&c.day===now.getDate()} dayEvents={viewEvents[c.day]||[]}/>)}
            </div>
          </div>
        </div>
        <TabBar onInsights={openInsights} balance={balanceDisplay} openAdd={openAdd}/>
      </div>);
    }

    // ── CalendarLive ──────────────────────────────────────
    const MON_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    function CalendarLive({openMenu,openCash,openInsights,openWeather,onDayTap,today="$0",balanceDisplay="$0",userName="",calendarEvents={},onScrollDir,isSyncing}){
      const dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
      const now=new Date();
      const scrollRef=useRef(null);
      const lastTop=useRef(0);
      const CELL_H=112;

      // Running balance: accumulate future events across all months from today's balance
      const runBal=useMemo(()=>{
        const BASE=7100; // current projected balance
        const n=new Date();
        const map={}; // key: "YYYY-M-D"
        let bal=BASE;
        for(let mi=0;mi<15;mi++){
          const dt=new Date(n.getFullYear(),n.getMonth()+mi,1);
          const yr=dt.getFullYear(),mo=dt.getMonth();
          const dim=new Date(yr,mo+1,0).getDate();
          const mevs=calendarEvents[`${yr}-${mo}`]||{};
          for(let d=1;d<=dim;d++){
            const isPast=mi===0&&d<n.getDate();
            if(!isPast)(mevs[d]||[]).forEach(e=>{bal+=e.amt;});
            map[`${yr}-${mo}-${d}`]=Math.round(bal);
          }
        }
        return map;
      },[calendarEvents]);

      const fmtBal=v=>v>=1000?`$${(v/1000).toFixed(1)}k`:`$${v}`;

      // Months starting from CURRENT month (no previous month offset)
      const months=useMemo(()=>{
        const res=[];
        for(let i=0;i<15;i++){
          const d=new Date(now.getFullYear(),now.getMonth()+i,1);
          res.push({year:d.getFullYear(),month:d.getMonth()});
        }
        return res;
      },[]);

      // Pure math scroll to show 1 row above today
      useEffect(()=>{
        const el=scrollRef.current; if(!el)return;
        const fd=(new Date(now.getFullYear(),now.getMonth(),1).getDay()+6)%7;
        const todayRow=Math.floor((fd+now.getDate()-1)/7);
        el.scrollTop=Math.max(0,(todayRow-1)*CELL_H);
      },[]);

      const handleScroll=()=>{
        const el=scrollRef.current; if(!el)return;
        const st=el.scrollTop;
        if(Math.abs(st-lastTop.current)>8){
          onScrollDir?.(st>lastTop.current?"up":"down");
          lastTop.current=st;
        }
      };

      const getBudget=(col,day,dim)=>{
        if(col!==6)return null;
        const isLast=day+7>dim;
        const wk=Math.ceil(day/7);
        if(isLast)return["Budget end",null,null];
        if(wk%2===0)return["Budget end","Set budget","Remaining $0"];
        return["Budget start","Set budget",null];
      };

      const BD="1px solid #f8fafc";
      const CS={borderBottom:BD,borderRight:BD,minHeight:`${CELL_H}px`,padding:"6px",textAlign:"left",background:"#fff",display:"block",width:"100%",overflow:"hidden",boxSizing:"border-box",verticalAlign:"top",transition:"background 0.15s"};

      const curLabel=new Date(now.getFullYear(),now.getMonth(),1).toLocaleString("default",{month:"long",year:"numeric"});

      return(
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",background:"#fff"}}>

        {/* TOP BAR */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 14px 6px",paddingTop:"calc(env(safe-area-inset-top,0px) + 10px)"}}>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={openMenu} className="grid h-11 w-11 place-items-center rounded-full bg-slate-100 text-xl transition active:scale-90">≡</button>
            <div className="grid h-11 w-11 place-items-center rounded-full bg-slate-100 text-lg">💬</div>
          </div>
          <button onClick={openCash} className="rounded-full bg-slate-100 px-6 py-1.5 text-center transition active:scale-95">
            <div className="text-lg font-extrabold leading-none">{today}</div>
            <div className="flex items-center justify-center gap-1 text-[11px] font-semibold text-slate-500">
              {isSyncing?"Syncing":"Today"}
              {isSyncing&&<span className="inline-block animate-spin" style={{fontSize:"10px"}}>↻</span>}
            </div>
          </button>
          <div style={{display:"flex",gap:"8px"}}>
            <button onClick={openInsights} className="grid h-11 w-11 place-items-center rounded-full bg-slate-100"><BarsIcon/></button>
            <div className="grid h-11 w-11 place-items-center rounded-full bg-slate-100 text-slate-400"><TrophyIcon/></div>
          </div>
        </div>

        {/* CLEAR SKIES BANNER */}
        <div style={{margin:"0 14px 0",background:"#f0fdf4",borderRadius:"16px",borderLeft:"4px solid #22c55e",padding:"10px 12px",display:"flex",gap:"10px",alignItems:"flex-start"}}>
          <span style={{fontSize:"32px",lineHeight:"1"}}>☀️</span>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px"}}>
              <span style={{fontSize:"16px",fontWeight:"800",color:"#059669"}}>Clear Skies</span>
              <button onClick={openWeather} style={{fontSize:"12px",fontWeight:"600",color:"#065f46",background:"#d1fae5",borderRadius:"999px",padding:"3px 12px"}}>Edit</button>
            </div>
            <div style={{fontSize:"13px",fontWeight:"500",color:"#047857",lineHeight:"1.4"}}>After 🏠 Rent + 1 expense on Jun 3, you'll have <b>$6k left</b></div>
          </div>
        </div>

        {/* MONTH PILL */}
        <div style={{display:"flex",justifyContent:"center",margin:"4px 0"}}>
          <button style={{display:"flex",alignItems:"center",gap:"6px",borderRadius:"999px",border:"1px solid #f1f5f9",background:"#fff",padding:"5px 18px",fontSize:"13px",fontWeight:"800",color:"#111827",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
            {curLabel} <span style={{fontSize:"10px",color:"#94a3b8"}}>▼</span>
          </button>
        </div>

        {/* DAY HEADERS */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",padding:"0 2px",borderBottom:"1px solid #e5e7eb"}}>
          {dows.map(d=><div key={d} style={{textAlign:"center",fontSize:"10px",fontWeight:"700",color:"#94a3b8",padding:"3px 0",letterSpacing:"0.05em",textTransform:"uppercase"}}>{d}</div>)}
        </div>

        {/* CALENDAR SCROLL AREA */}
        <div ref={scrollRef} style={{flex:1,overflowY:"auto",WebkitOverflowScrolling:"touch",paddingBottom:"8px"}} onScroll={handleScroll}>
          {months.map(({year,month},mi)=>{
            const isCur=year===now.getFullYear()&&month===now.getMonth();
            const fd=(new Date(year,month,1).getDay()+6)%7;
            const dim=new Date(year,month+1,0).getDate();
            const label=new Date(year,month,1).toLocaleString("default",{month:"long",year:"numeric"});
            const cells=[];
            for(let i=0;i<fd;i++)cells.push(null);
            for(let d=1;d<=dim;d++)cells.push(d);

            return(
              <div key={`${year}-${month}`}>
                {mi>0&&(
                  <div style={{display:"flex",justifyContent:"center",padding:"10px 0 6px"}}>
                    <div style={{display:"flex",alignItems:"center",gap:"6px",borderRadius:"999px",border:"1px solid #f1f5f9",background:"#fff",padding:"4px 16px",fontSize:"12px",fontWeight:"700",color:"#374151",boxShadow:"0 1px 4px rgba(0,0,0,0.07)"}}>
                      {label} <span style={{fontSize:"10px",color:"#94a3b8"}}>▼</span>
                    </div>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
                  {cells.map((day,i)=>{
                    const col=i%7;
                    if(day===null)return<div key={i} style={CS}/>;
                    const isToday=isCur&&day===now.getDate();
                    const isPast=isCur&&day<now.getDate();
                    const evs=(calendarEvents[`${year}-${month}`]?.[day])||[];
                    const balV=runBal[`${year}-${month}-${day}`];
                    const showBalNum=!isPast&&!isToday&&(evs.length>0||col===5||col===6)&&balV!=null;
                    const budget=getBudget(col,day,dim);

                    const evBorderColor=e=>{
                      if(e.amt>0)return"#4ade80";
                      if(e.color?.includes("rose"))return"#f87171";
                      if(e.color?.includes("amber"))return"#fbbf24";
                      if(e.color?.includes("purple"))return"#c084fc";
                      if(e.color?.includes("sky"))return"#38bdf8";
                      return"#94a3b8";
                    };
                    const evBgColor=e=>{
                      if(e.amt>0)return"#f0fdf4";
                      if(e.color?.includes("rose"))return"#fff1f2";
                      if(e.color?.includes("amber"))return"#fefce8";
                      if(e.color?.includes("purple"))return"#faf5ff";
                      if(e.color?.includes("sky"))return"#f0f9ff";
                      return"#f9fafb";
                    };

                    return(
                      <button key={i} onClick={()=>onDayTap?.(month,day)} style={CS}>
                        <span style={{display:"inline-grid",placeItems:"center",height:"24px",width:"24px",borderRadius:"50%",fontSize:"13px",fontWeight:"700",background:isToday?"#3b82f6":"transparent",color:isToday?"#fff":isPast?"#cbd5e1":"#111827"}}>{day}</span>
                        {isToday&&evs.length===0&&<div style={{fontSize:"9px",color:"#9ca3af",marginTop:"1px"}}>$0</div>}
                        {showBalNum&&<div style={{fontSize:"9px",fontWeight:"800",color:"#3b82f6",lineHeight:"1.3",marginTop:"1px"}}>{fmtBal(balV)}</div>}
                        <div style={{marginTop:"3px",display:"flex",flexDirection:"column",gap:"2px"}}>
                          {evs.slice(0,2).map((e,ki)=>(
                            <div key={ki} style={{borderRadius:"4px",borderLeft:`2px solid ${evBorderColor(e)}`,background:evBgColor(e),padding:"2px 3px",overflow:"hidden"}}>
                              <div style={{fontSize:"8px",fontWeight:"600",color:"#1e293b",lineHeight:"1.3",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{e.emoji} {e.label}</div>
                              <div style={{fontSize:"8px",fontWeight:"700",lineHeight:"1",color:e.amt>0?"#16a34a":"#ef4444"}}>{e.amt>0?"+":""}{fmt(Math.abs(e.amt))}</div>
                            </div>
                          ))}
                          {evs.length>2&&<div style={{fontSize:"7px",color:"#9ca3af"}}>+{evs.length-2}</div>}
                        </div>
                        {budget&&<div style={{marginTop:"3px"}}>
                          <div style={{fontSize:"7px",color:"#9ca3af",lineHeight:"1.6"}}>{budget[0]}</div>
                          {budget[1]&&<div style={{fontSize:"7px",color:"#6b7280",lineHeight:"1.6"}}>{budget[1]}</div>}
                          {budget[2]&&<div style={{fontSize:"7px",color:"#9ca3af",lineHeight:"1.6"}}>{budget[2]}</div>}
                        </div>}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>);
    }

    // ── QuickAddMenu ──────────────────────────────────────
    function QuickAddMenu({onClose,onExpense,onIncome,onGoal}){
      const [vis,setVis]=useState(false);
      useEffect(()=>{const t=setTimeout(()=>setVis(true),10);return()=>clearTimeout(t);},[]);
      const pills=[

        {label:"Income", emoji:"💰",cb:onIncome},

      ];
      return(
        <div className="absolute inset-0 z-40" onClick={onClose}>
          <div className="absolute inset-0 transition-opacity duration-200" style={{background:vis?"rgba(0,0,0,0.25)":"rgba(0,0,0,0)",backdropFilter:vis?"blur(2px)":"none"}}/>
          <div className="absolute bottom-0 left-0 right-0 flex flex-col items-center gap-3" style={{paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 84px)"}}>

              <button key={p.label} onClick={e=>{e.stopPropagation();onClose();p.cb();}}

                style={{width:"72%",padding:"17px 30px",
                  transform:vis?"translateY(0) scale(1)":`translateY(70px) scale(0.85)`,
                  opacity:vis?1:0,

    // ── Budget ────────────────────────────────────────────
    function EditBudgetSheet({cat,onSave,onClose}){
      const [val,setVal]=useState(String(cat.planned));

          <div><label className="text-xs font-bold uppercase tracking-wider text-slate-400">Monthly Budget ($)</label><input type="text" inputMode="decimal" value={val} onChange={e=>setVal(e.target.value)} className="mt-2 w-full rounded-2xl border border-slate-200 px-4 py-4 text-3xl font-bold text-slate-900 outline-none focus:border-blue-400"/></div>
          <div className="rounded-2xl bg-blue-50 p-3 text-sm text-blue-700">💡 At this rate you'll use <b>{Math.round((cat.used/(Number(val)||1))*100)}%</b> of your budget.</div>

    function Budget({openMenu,openCash,openInsights,openWeather,openAdd,liveCategories,today="$0"}){
      const [cats,setCats]=useState(()=>liveCategories||CATEGORIES);
      useEffect(()=>{
        if(!liveCategories)return;
        setCats(prev=>liveCategories.map(lc=>{const ex=prev.find(p=>p.name===lc.name);return ex?{...lc,planned:ex.planned}:lc;}));
      },[liveCategories]);
      const [editing,setEditing]=useState(null);
      const save=(name,planned)=>{setCats(p=>p.map(c=>c.name===name?{...c,planned,pct:Math.round((c.used/planned)*100)}:c));setEditing(null);};
      return(<div className="flex h-full flex-col">
        <TopBar today={today} openMenu={openMenu} openCash={openCash} openInsights={openInsights} openWeather={openWeather}/>
        <div className="flex-1 overflow-y-auto px-4" style={{paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 88px)"}}>
          <div className="flex items-center justify-between py-4"><h1 className="text-2xl font-extrabold text-slate-900">Budget</h1></div>
          {cats.map(c=>(<button key={c.name} onClick={()=>setEditing(c)} className="mb-3 w-full rounded-2xl bg-slate-50 p-4 text-left">
            <div className="flex items-center gap-3">
              <div className="grid h-12 w-12 place-items-center rounded-2xl bg-white text-xl shadow-sm">{c.icon}</div>
              <div className="flex-1"><div className="font-bold text-slate-900">{c.name}</div><div className="text-xs text-slate-500">Budget: {money(c.planned)}</div></div>
              <div className="text-right"><div className={cx("font-bold text-sm",c.text)}>{money(c.used)}</div><div className="text-xs text-slate-400">spent</div></div>
            </div>
            <div className="mt-3 h-2 overflow-hidden rounded-full bg-slate-200"><div className={cx("h-full rounded-full",c.bar)} style={{width:`${Math.min(c.pct,100)}%`}}/></div>
            <div className="mt-1 flex justify-between text-xs text-slate-400"><span>{c.pct}% used</span><span>{money(Math.max(c.planned-c.used,0))} left</span></div>
          </button>))}
        </div>
        {editing&&<EditBudgetSheet cat={editing} onSave={p=>save(editing.name,p)} onClose={()=>setEditing(null)}/>}
      </div>);
    }

    // ── Debt ──────────────────────────────────────────────

      const submit=()=>{if(!name||!total)return;onSave({icon,name,tag:"Loan",pct:0,paid:0,total:Number(total),apr:Number(apr)||0,pmt:Number(pmt)||0});onClose();};
      return(<Sheet2 title="Add Debt" sub="Track a new debt" onClose={onClose} footer={<><FlowBack onClick={onClose}/><FlowNext onClick={submit} label="Add Debt"/></>}>

          <div className="flex gap-2 flex-wrap">{ICONS.map(i=>(<button key={i} onClick={()=>setIcon(i)} className={cx("h-12 w-12 rounded-2xl text-2xl",icon===i?"bg-blue-100 ring-2 ring-blue-400":"bg-slate-100")}>{i}</button>))}</div>
          {[["Debt Name","","e.g. Car Loan",name,setName],["Total Balance ($)","decimal","0.00",total,setTotal],["APR (%)","decimal","0.0",apr,setApr],["Monthly Payment ($)","decimal","0.00",pmt,setPmt]].map(([l,mode,ph,v,s])=>(<div key={l}><label className="text-xs font-bold uppercase tracking-wider text-slate-400">{l}</label><input type="text" inputMode={mode||"text"} value={v} onChange={e=>s(e.target.value)} placeholder={ph} className="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-slate-900 outline-none focus:border-blue-400"/></div>))}

    function Debt({openMenu,openCash,openInsights,openWeather,openAdd,today="$0"}){
      const [debts,setDebts]=useState(DEBTS);

      const [adding,setAdding]=useState(false);
      const makePayment=(name,pmt)=>{setDebts(p=>p.map(d=>{if(d.name!==name)return d;const paid=Math.min(d.paid+pmt,d.total);return{...d,paid,pct:Math.round((paid/d.total)*100)};}));setEditing(null);};
      return(<div className="flex h-full flex-col">
        <TopBar today={today} openMenu={openMenu} openCash={openCash} openInsights={openInsights} openWeather={openWeather}/>
        <div className="flex-1 overflow-y-auto px-4" style={{paddingBottom:"calc(env(safe-area-inset-bottom,0px) + 88px)"}}>
          <div className="flex items-center justify-between py-4"><h1 className="text-2xl font-extrabold text-slate-900">Debts</h1><button onClick={()=>setAdding(true)} className="grid h-9 w-9 place-items-center rounded-full bg-blue-500 text-white text-xl">+</button></div>

              <div className="flex items-center gap-3"><span className="text-2xl">{d.icon}</span><div><div className="font-bold text-slate-900">{d.name}</div><div className="text-xs text-slate-500">{d.tag} · {d.apr}% APR</div></div></div>
              <div className="text-right"><div className="font-extrabold text-slate-900">{money(d.total-d.paid)}</div><div className="text-xs text-slate-400">remaining</div></div>

          </button>))}

        </div>

            <div><label className="text-xs font-bold uppercase tracking-wider text-slate-400">Email</label><input value={tmpEmail} onChange={e=>setTmpEmail(e.target.value)} className="mt-1 w-full rounded-2xl border border-slate-200 px-4 py-3 text-slate-900 outline-none focus:border-blue-400"/></div>

    // ── Updates overlay ───────────────────────────────────
    function UpdatesSheet({onClose}){
      const items=[["🎉","v1.3 — Smart Forecasting","Balance predictions now account for recurring bills automatically."],["📊","v1.2 — Insights upgrade","New Net Worth chart and 6-month projection view."],["🏆","v1.1 — Weather Warnings","Set custom balance thresholds with visual alerts."],["📅","v1.0 — Launch","CashCycle is live! Calendar, Budget, Debt & Goals tracking."]];

    // ── Shared layout helpers (must be top-level — never define inside another component) ──
    function OnboardingCard({icon,title,sub,children,footer}){return(<div className="flex flex-1 flex-col px-6 pt-6">
      {icon&&<div className="mx-auto mb-3 grid h-16 w-16 place-items-center rounded-full bg-slate-100 text-3xl">{icon}</div>}
      <h1 className="text-center text-3xl font-extrabold tracking-tight">{title}</h1>
      {sub&&<p className="mt-2 text-center text-slate-500">{sub}</p>}
      <div className="mt-6 flex-1 overflow-y-auto">{children}</div>
      <div className="sticky bottom-0 flex items-center justify-center gap-3 bg-white/80 pt-4 backdrop-blur" style={{paddingBottom:"calc(env(safe-area-inset-bottom,20px) + 8px)"}}>{footer}</div>
    </div>);}
    function SetupSheet({title,sub,children,footer}){return(<div className="absolute inset-0 flex flex-col justify-end bg-black/30"><div className="flex max-h-[88%] flex-col rounded-t-[36px] bg-white px-6 pt-7" style={{paddingBottom:"calc(env(safe-area-inset-bottom,20px) + 8px)"}}><h1 className="text-3xl font-extrabold">{title}</h1>{sub&&<p className="mt-1 text-slate-500">{sub}</p>}<div className="mt-5 flex-1 overflow-y-auto">{children}</div><div className="mt-4 flex gap-3">{footer}</div></div></div>);}
    function SetupNx(p){return<button {...p} className="flex-1 rounded-2xl bg-blue-500 py-4 text-center font-bold text-white">Next →</button>;}
    function SetupBk({onClick}){return<button onClick={onClick} className="rounded-2xl bg-slate-100 px-6 py-4 font-bold text-slate-600">‹ Back</button>;}
    function SwipeClose({onClose,children,className}){
      const ref=useRef(null);
      useEffect(()=>{
        const el=ref.current;if(!el)return;
        let sx=0,sy=0;
        const ts=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;};
        const te=e=>{const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);if(dx>60&&dy<80)onClose?.();};
        el.addEventListener("touchstart",ts,{passive:true});
        el.addEventListener("touchend",te,{passive:true});
        return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};
      },[onClose]);
      return<div ref={ref} className={className}>{children}</div>;
    }

    // ── Onboarding ────────────────────────────────────────
    function Onboarding({onDone}){
      const [step,setStep]=useState(0);
      const [lang,setLang]=useState("English");
      const [name,setName]=useState("");
      const next=()=>setStep(s=>s+1);
      const steps=[
        <OnboardingCard key="lang" icon="🌐" title="Choose your language" sub="You can change this later in Settings" footer={<PrimaryBtn onClick={next}>Next →</PrimaryBtn>}>
          <div className="space-y-3">{LANGS.map(([n,en])=>(<button key={n} onClick={()=>setLang(n)} className={cx("flex w-full items-center justify-between rounded-2xl border px-5 py-4 text-left transition",lang===n?"border-slate-400 bg-slate-50":"border-slate-200")}><div><div className="font-bold">{n}</div><div className="text-sm text-slate-500">{en}</div></div><Check on={lang===n}/></button>))}</div>
        </OnboardingCard>,
        <OnboardingCard key="name" icon="👤" title="What's your first name?" sub="We'll use this to personalize your experience">
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Enter your first name" className="w-full rounded-2xl border border-slate-200 px-5 py-4 text-lg outline-none focus:border-blue-400"/>
          <button onClick={next} disabled={!name} className={cx("mt-4 w-full rounded-2xl py-4 font-bold text-white",name?"bg-blue-500":"bg-slate-200 text-slate-400")}>Continue</button>
        </OnboardingCard>,
        <OnboardingCard key="done" icon="🚀" title={`Welcome${name?", "+name:""}!`} sub="Next, let's set up your accounts." footer={<PrimaryBtn onClick={()=>onDone({name,lang})}>Get Started →</PrimaryBtn>}>
          <div className="rounded-2xl bg-slate-50 p-6 text-center text-slate-500">Language: <b>{lang}</b></div>
        </OnboardingCard>
      ];
      return(<div className="flex h-full flex-col" style={{paddingTop:"env(safe-area-inset-top,44px)"}}>
        <div className="h-1.5 w-full bg-slate-100"><div className="h-full bg-blue-500 transition-all" style={{width:`${((step+1)/steps.length)*100}%`}}/></div>
        {steps[step]}
      </div>);
    }

    // ── AccountSetup ──────────────────────────────────────
    const INCOME_ICONS=["🕐","💰","💼","🏢","📦","🎵","✂️","🖥️","🚗","🌱"];
    function IncomeRow({inc,idx,onChange,onRemove}){
      return(
        <div className="rounded-2xl bg-slate-50 p-4 space-y-3">
          <div className="flex items-center gap-2">
            <span className="text-2xl">{inc.icon}</span>
            <input
              value={inc.label}
              onChange={e=>onChange(idx,"label",e.target.value)}

              className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold text-slate-900 outline-none focus:border-blue-400"
            />
            <button onClick={()=>onRemove(idx)} className="grid h-8 w-8 place-items-center rounded-full bg-rose-100 text-rose-500 text-sm font-bold flex-shrink-0">✕</button>
          </div>
          <div className="flex items-center gap-2">
            <div className="relative flex-1">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 font-bold text-slate-400">$</span>
              <input
                type="text" inputMode="decimal"
                value={inc.amt}
                onChange={e=>onChange(idx,"amt",e.target.value)}

                className="w-full rounded-xl border border-slate-200 pl-7 pr-3 py-3 text-xl font-extrabold text-slate-900 outline-none focus:border-blue-400"
              />
            </div>
            <select
              value={inc.freq}
              onChange={e=>onChange(idx,"freq",e.target.value)}
              className="rounded-xl border border-slate-200 px-3 py-3 text-sm font-semibold text-slate-700 outline-none bg-white"
            >
              {["Weekly","Bi-Weekly","Monthly","Yearly"].map(f=><option key={f}>{f}</option>)}
            </select>

    }
    function AccountSetup({onDone}){
      const [step,setStep]=useState(0);
      const [showBankList,setShowBankList]=useState(false);
      const [bankQuery,setBankQuery]=useState("");
      const [linkStep,setLinkStep]=useState("idle"); // idle | connecting | syncing | done
      const [linkProgress,setLinkProgress]=useState(0);
      const [linkMsg,setLinkMsg]=useState("");
      const [linkedBank,setLinkedBank]=useState(null);
      const [accts,setAccts]=useState([]);
      const [incomes,setIncomes]=useState([{icon:"🕐",label:"Hourly Job",amt:"1600",freq:"Bi-Weekly"}]);
      const next=()=>setStep(s=>s+1);
      const back=()=>setStep(s=>Math.max(0,s-1));
      const toggle=i=>setAccts(p=>p.map((a,k)=>k===i?{...a,on:!a.on}:a));
      const changeIncome=(i,field,val)=>setIncomes(p=>p.map((inc,k)=>k===i?{...inc,[field]:val}:inc));
      const removeIncome=i=>setIncomes(p=>p.filter((_,k)=>k!==i));
      const addIncome=()=>setIncomes(p=>[...p,{icon:INCOME_ICONS[p.length%INCOME_ICONS.length],label:"",amt:"",freq:"Monthly"}]);

      const simulateLink=(bank)=>{
        setShowBankList(false);setLinkedBank(bank);setLinkStep("connecting");setLinkProgress(0);
        const msgs=["Establishing secure connection…","Verifying your identity…","Fetching accounts…","Pulling transactions…","Analyzing spending…","Detecting recurring payments…","Finalizing sync…","Done!"];
        let p=0,mi=0;
        setTimeout(()=>{
          setLinkStep("syncing");
          const iv=setInterval(()=>{
            p+=Math.random()*13+4;
            if(mi<msgs.length-1&&p>(mi+1)*12){setLinkMsg(msgs[++mi]);}
            if(p>=100){
              clearInterval(iv);setLinkProgress(100);setLinkStep("done");
              const d=generateBankData(bank);
              setAccts(d.accounts.map(a=>({icon:a.type==="checking"?"🏦":"💰",name:a.name,amt:a.balance,number:a.number,on:true,bankName:bank.name,bankIcon:bank.icon,bankColor:bank.color})));
            } else setLinkProgress(Math.min(p,99));
          },350);
        },900);
      };

      const filteredBanks=BANKS.filter(b=>b.name.toLowerCase().includes(bankQuery.toLowerCase())||b.sub.toLowerCase().includes(bankQuery.toLowerCase()));
      const totalSelected=accts.filter(a=>a.on).reduce((s,a)=>s+a.amt,0);

      if(showBankList) return(
        <div className="absolute inset-0 z-50 flex flex-col bg-white" style={{paddingTop:"calc(env(safe-area-inset-top,0px)+8px)"}}>
          <div className="flex items-center gap-3 px-5 pb-3">
            <button onClick={()=>setShowBankList(false)} className="grid h-10 w-10 place-items-center rounded-full bg-slate-100 text-slate-500 text-lg">‹</button>
            <h1 className="text-xl font-extrabold text-slate-900">Choose Your Bank</h1>
          </div>
          <div className="px-5 pb-3">
            <div className="flex items-center gap-2 rounded-2xl bg-slate-100 px-4 py-3">
              <span className="text-slate-400">🔍</span>
              <input value={bankQuery} onChange={e=>setBankQuery(e.target.value)} placeholder="Search banks…" className="flex-1 bg-transparent text-slate-900 outline-none placeholder:text-slate-400"/>
            </div>
          </div>
          <div className="flex-1 overflow-y-auto px-5 space-y-2 pb-6">
            {!bankQuery&&<p className="text-[11px] font-bold uppercase tracking-widest text-slate-400 pb-1">All Banks</p>}
            {filteredBanks.map(b=>(
              <button key={b.id} onClick={()=>simulateLink(b)} className="flex w-full items-center gap-4 rounded-2xl bg-slate-50 px-4 py-4 text-left transition active:scale-[0.98]">
                <div className="grid h-12 w-12 flex-shrink-0 place-items-center rounded-2xl text-2xl text-white font-bold" style={{background:b.color}}>{b.icon}</div>
                <div className="flex-1 min-w-0"><div className="font-bold text-slate-900 truncate">{b.name}</div><div className="text-xs text-slate-400 truncate">{b.sub}</div></div>
                <span className="text-slate-300 text-lg">›</span>
              </button>
            ))}
          </div>
          <div className="px-5 py-3 border-t text-center text-xs text-slate-400">🔒 256-bit encryption · Read-only access · We never store your password</div>
        </div>
      );

      const screens=[
        /* welcome */
        <div key="w" className="absolute inset-0 flex flex-col justify-end bg-black/30">
          <div className="m-4 rounded-[36px] bg-white p-8 text-center">
            <div className="mx-auto mb-4 grid h-20 w-20 place-items-center rounded-full bg-blue-100 text-4xl">🏦</div>
            <h1 className="text-3xl font-extrabold text-slate-900">Connect Your Bank</h1>
            <p className="mt-2 text-slate-500">Link your bank to automatically track every expense and get 100% accurate balances.</p>
            <button onClick={next} className="mt-6 w-full rounded-2xl bg-blue-500 py-4 font-bold text-white">Get Started →</button>
          </div>
        </div>,

        /* bank link + account select */
        <SetupSheet key="s" title="Connect Your Bank" sub="Securely link your accounts — read-only access" footer={<><SetupBk onClick={back}/><SetupNx onClick={next} disabled={accts.length===0}/></>}>
          {linkStep==="idle"&&(
            <button onClick={()=>{setBankQuery("");setShowBankList(true);}} className="w-full rounded-2xl border-2 border-dashed border-blue-200 bg-blue-50 p-6 text-center transition active:scale-95">
              <div className="text-3xl mb-2">🏛️</div>
              <div className="font-bold text-blue-600">+ Connect Your Bank Account</div>
              <div className="text-xs mt-1 text-blue-400">Chase · PNC · Wells Fargo · BofA + 25 more</div>
            </button>
          )}
          {(linkStep==="connecting"||linkStep==="syncing")&&linkedBank&&(
            <div className="rounded-2xl bg-slate-50 p-6 text-center">
              <div className="grid h-16 w-16 place-items-center rounded-2xl text-3xl text-white mx-auto mb-3" style={{background:linkedBank.color}}>{linkedBank.icon}</div>
              <div className="font-bold text-slate-900 mb-1">{linkedBank.name}</div>
              <div className="text-sm text-slate-500 mb-4">{linkStep==="connecting"?"Establishing secure connection…":linkMsg||"Syncing your data…"}</div>
              <div className="w-full rounded-full bg-slate-200 h-2.5 overflow-hidden mb-1">
                <div className="h-full rounded-full bg-blue-500 transition-all duration-500" style={{width:`${linkProgress}%`}}/>
              </div>
              <div className="text-blue-500 font-bold text-sm">{Math.round(linkProgress)}%</div>
            </div>
          )}
          {linkStep==="done"&&accts.length>0&&(
            <div className="space-y-3">
              <div className="flex items-center gap-3 rounded-2xl px-4 py-3" style={{background:linkedBank.color}}>
                <span className="text-2xl">{linkedBank.icon}</span>
                <div className="flex-1"><div className="font-bold text-white">{linkedBank.name}</div><div className="text-xs text-white/80">✓ Connected — {accts.length} account{accts.length>1?"s":""} found</div></div>
                <button onClick={()=>{setLinkStep("idle");setLinkedBank(null);setAccts([]);}} className="text-white/70 text-lg">✕</button>
              </div>

                  <div className="flex-1 min-w-0"><div className="font-bold text-slate-900 truncate">{a.name}</div><div className="text-xs text-slate-400">{a.number}</div></div>
                  <span className={cx("font-extrabold",a.on?"text-blue-500":"text-slate-400")}>{money(a.amt)}</span>
                </button>
              ))}
              <div className="rounded-2xl bg-emerald-50 px-4 py-3 flex items-center justify-between">
                <span className="text-sm font-semibold text-emerald-700">Total Selected</span>
                <span className="font-extrabold text-emerald-600">{money(totalSelected)}</span>
              </div>
            </div>
          )}
        </SetupSheet>,

        /* income review */
        <SetupSheet key="ri" title="Review Your Income" sub="We detected these income sources from your bank" footer={<><SetupBk onClick={back}/><button onClick={()=>onDone({accounts:accts,incomes})} className="flex-1 rounded-2xl bg-blue-500 py-4 font-bold text-white">Finish →</button></>}>
          <div className="space-y-3">
            {incomes.map((inc,i)=><IncomeRow key={i} inc={inc} idx={i} onChange={changeIncome} onRemove={removeIncome}/>)}

          </div>
        </SetupSheet>
      ];
      return<div className="relative h-full" style={{paddingTop:"env(safe-area-inset-top,44px)"}}>{screens[step]}{showBankList&&<div className="absolute inset-0 z-50" style={{paddingTop:"env(safe-area-inset-top,0px)"}}/>}</div>;
    }
    // ── BudgetWizard / NetWorthFlow / AllSet ─────────────
    function BudgetWizard({onDone,onBack}){
      const [step,setStep]=useState(0);
      const [cycle,setCycle]=useState("Weekly");
      const [rows,setRows]=useState(WEEKLY_BUDGET_ROWS);
      const setVal=(i,v)=>setRows(p=>p.map((r,k)=>k===i?{...r,val:Number(v)||0}:r));
      if(step===0)return(<Sheet2 title="Budget Cycle" sub="Choose how you think about spending" onClose={onBack} footer={<><FlowBack onClick={onBack}/><FlowNext onClick={()=>setStep(1)}/></>}>
        <div className="space-y-3">{BUDGET_CYCLES.map(([ic,t,s])=>(<button key={t} onClick={()=>setCycle(t)} className={cx("flex w-full items-center gap-4 rounded-2xl border-2 p-4 text-left transition",cycle===t?"border-blue-500 bg-blue-50":"border-transparent bg-slate-50")}><span className="text-2xl">{ic}</span><div className="flex-1"><div className="font-extrabold">{t}</div><div className="text-sm text-slate-500">{s}</div></div></button>))}</div>
      </Sheet2>);
      return(<Sheet2 title="Set Budgets" sub={`Projections for your ${cycle} cycle`} onClose={()=>setStep(0)} footer={<><FlowBack onClick={()=>setStep(0)}/><FlowNext onClick={onDone}/></>}>
        <div className="space-y-3">{rows.map((r,i)=>(<div key={r.name} className={cx("rounded-2xl border-l-4 p-4",r.bar)}><div className="flex items-center gap-3"><span className="text-2xl">{r.icon}</span><div className="flex-1 font-bold text-slate-900">{r.name}</div><input type="text" inputMode="decimal" value={r.val} onChange={e=>setVal(i,e.target.value)} className="w-20 rounded-lg border p-1 text-right"/></div></div>))}</div>
      </Sheet2>);
    }
    function NetWorthFlow({onDone,onBack}){
      const [step,setStep]=useState(0);
      const [assets,setAssets]=useState([]);
      const [liabs,setLiabs]=useState([]);
      const toggle=(set,val)=>set(p=>p.includes(val)?p.filter(x=>x!==val):[...p,val]);
      return(<Sheet2 title={step===0?"Select Assets":"Select Liabilities"} sub="Track what you own and owe" onClose={step===0?onBack:()=>setStep(0)} footer={<><FlowBack onClick={step===0?onBack:()=>setStep(0)}/><FlowNext onClick={step===0?()=>setStep(1):onDone}/></>}>
        <div className="flex flex-wrap gap-2">{(step===0?ASSETS:LIABILITIES).map(([ic,n])=>(<SelectPill key={n} icon={ic} label={n} active={(step===0?assets:liabs).includes(n)} onClick={()=>toggle(step===0?setAssets:setLiabs,n)}/>))}</div>
      </Sheet2>);
    }
    function AllSet({onDone}){
      return(<div className="absolute inset-0 z-30 flex flex-col justify-end bg-black/30">
        <div className="rounded-t-[36px] bg-white px-6 pb-8 pt-7 text-center">
          <span className="rounded-full bg-purple-100 px-4 py-1 text-sm font-semibold text-purple-600">🎉 Ready!</span>
          <h1 className="mt-4 text-4xl font-extrabold leading-tight text-slate-900">You're all set!</h1>
          <p className="mt-3 text-slate-500">We've unlocked full access for 30 days.</p>
          <button onClick={onDone} className="mt-6 w-full rounded-full bg-blue-500 py-5 text-lg font-bold text-white shadow-lg">Get Started</button>
        </div>
      </div>);
    }

    // ── SplashScreen ─────────────────────────────────────
    function SplashScreen({onDone,duration=1800}){
      const [entered,setEntered]=useState(false);
      const [leaving,setLeaving]=useState(false);
      useEffect(()=>{
        const t1=setTimeout(()=>setEntered(true),50);
        const t2=setTimeout(()=>setLeaving(true),duration-400);
        const t3=setTimeout(()=>onDone?.(),duration);
        return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
      },[]);
      return(
        <div className={cx("z-[9999] transition-opacity duration-500",leaving?"opacity-0 pointer-events-none":"opacity-100")} style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"#2ecc5f",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <span className={cx("text-8xl transition-all duration-700 ease-out",entered?"translate-y-0 opacity-100":"translate-y-8 opacity-0")}>☀️</span>
          <span className={cx("mt-4 text-2xl font-extrabold text-white tracking-tight transition-all duration-700 delay-100",entered?"opacity-100":"opacity-0")}>CashCycle</span>
        </div>
      );
    }

    // ── WeatherWarnings ───────────────────────────────────
    const TIERS = [
      { key:"clear",  label:"Clear Skies",   emoji:"☀️",  prefix:"Above", value:500, accent:"#16a34a", accentLight:"#dcfce7", bg:"#f0fdf4", border:"#bbf7d0" },
      { key:"partly", label:"Partly Cloudy", emoji:"⛅",  prefix:"Above", value:300, accent:"#0ea5e9", accentLight:"#e0f2fe", bg:"#f0f9ff", border:"#bae6fd" },
      { key:"rain",   label:"Rain Expected", emoji:"🌧️", prefix:"Above", value:100, accent:"#ea580c", accentLight:"#ffedd5", bg:"#fff7ed", border:"#fed7aa" },
      { key:"storm",  label:"Storm Warning", emoji:"⛈️", prefix:"At",    value:0,   accent:"#475569", accentLight:"#e2e8f0", bg:"#f8fafc", border:"#e2e8f0" },
    ];
    const WW_MIN = 0, WW_MAX = 800;
    function ThresholdSlider({ tier, value, onChange }) {
      const pct = ((value - WW_MIN) / (WW_MAX - WW_MIN)) * 100;
      return (
        <div className="rounded-2xl p-5 mb-4 border" style={{ backgroundColor: tier.bg, borderColor: tier.border }}>
          <div className="flex items-start justify-between mb-4">
            <div className="flex items-center gap-3">
              <span className="text-3xl">{tier.emoji}</span>
              <div>
                <div className="font-bold text-lg" style={{ color: tier.accent }}>{tier.label}</div>
                <div className="text-sm" style={{ color: tier.accent, opacity: 0.8 }}>{tier.prefix} ${value}</div>
              </div>
            </div>
            <div className="font-bold text-2xl" style={{ color: tier.accent }}>${value}</div>
          </div>
          <input type="range" min={WW_MIN} max={WW_MAX} step={10} value={value}
            onChange={e => onChange(Number(e.target.value))}
            className="w-full appearance-none cursor-pointer h-2.5 rounded-full"
            style={{ background: `linear-gradient(to right, ${tier.accent} 0%, ${tier.accent} ${pct}%, ${tier.accentLight} ${pct}%, ${tier.accentLight} 100%)`, "--thumb": tier.accent }}
          />
        </div>
      );
    }
    function WeatherWarnings({ onClose }) {
      const [tiers, setTiers] = useState(TIERS);
      const setValue = (key, value) => setTiers(prev => prev.map(t => t.key === key ? { ...t, value } : t));
      return (
        <div className="flex h-full flex-col overflow-y-auto px-5 pb-10 bg-white" style={{paddingTop:"calc(env(safe-area-inset-top,0px) + 16px)"}}>
          <style>{`input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:30px;border-radius:99px;background:var(--thumb);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.2);}input[type="range"]::-moz-range-thumb{width:56px;height:30px;border:none;border-radius:99px;background:var(--thumb);cursor:pointer;}`}</style>
          <div className="flex items-start justify-between mb-6">
            <div><h1 className="text-2xl font-extrabold text-slate-900">Weather Warnings</h1><p className="text-slate-500 text-sm">Adjust balance thresholds</p></div>
            <div className="flex items-center gap-2">
              <button onClick={onClose} className="bg-blue-500 text-white font-bold rounded-full px-5 py-2">Save</button>
              <button onClick={onClose} className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 text-xl">✕</button>
            </div>
          </div>
          <div className="h-9 rounded-full mb-2" style={{ background: "linear-gradient(to right, #475569, #ea580c, #0ea5e9, #16a34a)" }}/>
          <div className="flex justify-between text-xs font-bold text-slate-400 mb-6"><span>$0</span><span>$800</span></div>
          <h2 className="text-xl font-bold text-slate-900 mb-4">Balance Thresholds</h2>
          {tiers.map(tier => <ThresholdSlider key={tier.key} tier={tier} value={tier.value} onChange={v => setValue(tier.key, v)}/>)}
        </div>
      );
    }

    const STORE_KEY="cashcycle_v1";
    const DEFAULT_TXS=[
      {id:1,type:"expense",emoji:"🚗",label:"Car Pay",amt:400,date:"May 20",category:"Transportation"},
      {id:2,type:"income",emoji:"🕐",label:"Hourly Job",amt:1600,date:"May 22",category:"Income"},
      {id:3,type:"expense",emoji:"🏠",label:"Rent",amt:1000,date:"Jun 1",category:"Bills"},
      {id:4,type:"expense",emoji:"📱",label:"Phone Bill",amt:80,date:"Jun 3",category:"Bills"},
      {id:5,type:"income",emoji:"🕐",label:"Hourly Job",amt:1600,date:"Jun 5",category:"Income"},
    ];
    function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||"{}");}catch(e){return{};}}


    function ForecastContainer(){
      const [booted,setBooted]=useState(false);
      const [toast,setToast]=useState(null);
      const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);};
      const sv=useMemo(loadSaved,[]);
      const [phase,setPhase]=useState(sv.phase||"onboarding");
      const [tab,setTab]=useState(sv.tab||"home");
      const [menuOpen,setMenuOpen]=useState(false);
      const [overlay,setOverlay]=useState(null);
      const [dark,setDark]=useState(sv.dark||false);
      const [accent,setAccent]=useState(sv.accent||"#3b82f6");
      const [userName,setUserName]=useState(sv.userName||"");
      const [userEmail,setUserEmail]=useState(sv.userEmail||"");
      const [userLang,setUserLang]=useState(sv.userLang||"English");
      const [connectedBanks,setConnectedBanks]=useState(sv.connectedBanks||[]);
      const [transactions,setTransactions]=useState(sv.transactions||DEFAULT_TXS);
      const [goals,setGoals]=useState(sv.goals||GOALS);
      const [dockVisible,setDockVisible]=useState(true);
      const [addMenuOpen,setAddMenuOpen]=useState(false);
      const [accounts,setAccounts]=useState(sv.accounts||[]);
      const [isSyncing,setIsSyncing]=useState(false);

      // Auto-sync simulation: re-fetch every 20 seconds when in app phase
      useEffect(()=>{
        if(phase!=="app")return;
        const iv=setInterval(()=>{
          setIsSyncing(true);
          setTimeout(()=>setIsSyncing(false),2000);
        },20000);
        return()=>clearInterval(iv);
      },[phase]);

      // Persist all state to localStorage on every change
      useEffect(()=>{
        try{
          localStorage.setItem(STORE_KEY,JSON.stringify({phase,tab,dark,accent,userName,userEmail,userLang,connectedBanks,transactions,goals,accounts}));
        }catch(e){}
      },[phase,tab,dark,accent,userName,userEmail,userLang,connectedBanks,transactions,goals,accounts]);

      const addTransaction=tx=>setTransactions(p=>[tx,...p]);
      const onBankConnect=(bank,data)=>{
        setConnectedBanks(p=>[...p,{bank,data}]);
        setTransactions(p=>[...data.transactions.map(tx=>({...tx,id:Date.now()+Math.random()})),...p]);
      };

      const handleSetupDone=(data)=>{
        if(data?.accounts){
          const linked=data.accounts.filter(a=>a.on);
          setAccounts(linked);
          // Import bank transactions into the transaction list
          const bank=linked[0];
          if(bank?.bankName){
            const matchedBank=BANKS.find(b=>b.name===bank.bankName);
            if(matchedBank){
              const d=generateBankData(matchedBank);
              setTransactions(p=>[...d.transactions.map(tx=>({...tx,id:Date.now()+Math.random()})),...p]);
            }
          }
        }
        setPhase("app");
      };

      // ── Derived computed state ──────────────────────────
      const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const nowRef=new Date();
      const curMonth=MONTH_NAMES[nowRef.getMonth()];

      const calendarEvents=useMemo(()=>{
        const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const map={};
        transactions.forEach(tx=>{
          let yr,mo,day;
          if(tx.date==="Today"){const n=new Date();yr=n.getFullYear();mo=n.getMonth();day=n.getDate();}
          else{
            const [mon,d]=tx.date.split(" ");
            const mi=MN.indexOf(mon);
            if(mi===-1||!d)return;
            yr=nowRef.getFullYear();mo=mi;
            if(mi<nowRef.getMonth())yr++;
            day=parseInt(d);
          }
          if(!day||isNaN(day))return;
          const key=`${yr}-${mo}`;
          if(!map[key])map[key]={};
          if(!map[key][day])map[key][day]=[];
          const color=tx.type==="income"?"bg-emerald-100 border-emerald-400":tx.category==="Bills"?"bg-rose-100 border-rose-400":tx.category==="Food"?"bg-amber-100 border-amber-400":tx.category==="Entertainment"?"bg-purple-100 border-purple-400":tx.category==="Transport"||tx.category==="Transportation"?"bg-sky-100 border-sky-400":"bg-slate-100 border-slate-400";
          map[key][day].push({emoji:tx.emoji,label:tx.label,amt:tx.type==="income"?tx.amt:-tx.amt,color});
        });
        return map;
      },[transactions]);

      const CAT_DEF=[
        {icon:"🍔",name:"Food",planned:232,bar:"bg-amber-400",text:"text-amber-500"},
        {icon:"🚗",name:"Transportation",planned:173,bar:"bg-sky-400",text:"text-sky-500"},
        {icon:"🎬",name:"Entertainment",planned:80,bar:"bg-purple-500",text:"text-purple-600"},
        {icon:"🧾",name:"Bills",planned:300,bar:"bg-rose-400",text:"text-rose-500"},
        {icon:"💊",name:"Health",planned:100,bar:"bg-emerald-400",text:"text-emerald-600"},
      ];
      const liveCategories=useMemo(()=>{
        const spending={};
        transactions.forEach(tx=>{
          if(tx.type!=="expense")return;
          const cat=tx.category==="Transport"?"Transportation":tx.category;
          if(cat&&cat!=="Expense"&&cat!=="Income") spending[cat]=(spending[cat]||0)+tx.amt;
        });
        return CAT_DEF.map(c=>{
          const used=Math.round((spending[c.name]||0)*100)/100;
          const pct=c.planned>0?Math.min(Math.round((used/c.planned)*100),999):0;
          return{...c,used,pct};
        }).filter(c=>c.used>0||["Food","Transportation","Entertainment"].includes(c.name));
      },[transactions]);

      const totalBalance=useMemo(()=>{
        if(accounts.length>0) return accounts.filter(a=>a.on).reduce((s,a)=>s+a.amt,0);
        const bankBal=connectedBanks.reduce((s,cb)=>s+cb.data.accounts.reduce((a,acc)=>a+acc.balance,0),0);
        return 7500+bankBal;
      },[accounts,connectedBanks]);
      const balanceDisplay=totalBalance>=1000?`$${(totalBalance/1000).toFixed(1)}k`:money(totalBalance);

      const go=dest=>{setMenuOpen(false);setDockVisible(true);setTab(dest);};
      const resetApp=()=>{
        try{localStorage.removeItem(STORE_KEY);}catch(e){}
        setPhase("onboarding");setTab("home");setOverlay(null);
        setConnectedBanks([]);setTransactions(DEFAULT_TXS);
        setUserName("");setUserEmail("");setUserLang("English");
        setDark(false);setAccent("#3b82f6");
      };
      const cp={
        isSyncing,
        openMenu:()=>setMenuOpen(true),
        openCash:()=>setOverlay("cash"),
        openInsights:()=>setOverlay("insights"),
        openWeather:()=>setOverlay("weather"),
        openAdd:()=>setOverlay("add"),
        transactions,addTransaction,
        today:balanceDisplay,balanceDisplay,calendarEvents,liveCategories,userName,
      };
      return(
        <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,display:"flex",flexDirection:"column",background:"#fff"}}>
          {!booted?<SplashScreen onDone={()=>setBooted(true)}/>:(
            <>
              {phase==="onboarding"&&<Onboarding onDone={({name,lang})=>{setUserName(name);setUserLang(lang);setPhase("setup");}}/>}
              {phase==="setup"&&<AccountSetup onDone={handleSetupDone}/>}
              {phase==="budgetWizard"&&<BudgetWizard onBack={()=>setPhase("setup")} onDone={()=>setPhase("netWorth")}/>}
              {phase==="netWorth"&&<NetWorthFlow onBack={()=>setPhase("budgetWizard")} onDone={()=>setPhase("allSet")}/>}
              {phase==="allSet"&&<AllSet onDone={()=>setPhase("app")}/>}
              {phase==="app"&&(
                <TabCtx.Provider value={{tab,setTab}}>
                  {/* Tab content fills remaining space */}
                  <div style={{flex:1,position:"relative",overflow:"hidden",minHeight:0}}>
                    {tab==="home"&&<CalendarLive {...cp} onDayTap={()=>{setAddMenuOpen(false);setOverlay("add");}} onScrollDir={dir=>{if(dir==="up")setDockVisible(false);else setDockVisible(true);}}/>}
                    {tab==="history"&&<History {...cp}/>}
                    {tab==="budget"&&<Budget {...cp}/>}
                    {tab==="debt"&&<Debt {...cp}/>}
                    {tab==="goals"&&<Goals {...cp} goals={goals} setGoals={setGoals}/>}
                    {tab==="profile"&&<Profile openMenu={cp.openMenu} openAdd={cp.openAdd} connectedBanks={connectedBanks} onBankConnect={onBankConnect} userName={userName} setUserName={setUserName} userEmail={userEmail} setUserEmail={setUserEmail}/>}
                    {tab==="settings"&&<Settings openMenu={cp.openMenu} dark={dark} setDark={setDark} accent={accent} setAccent={setAccent} resetApp={resetApp} userLang={userLang} setUserLang={setUserLang}/>}
                    {(overlay==="insights"||overlay==="cash"||overlay==="weather")&&(
                      <div className={cx("absolute inset-0 z-30 transition-colors",dark?"bg-slate-900":"bg-white")}>
                        {overlay==="insights"&&<Insights onClose={()=>setOverlay(null)}/>}
                        {overlay==="cash"&&<CashBalance onClose={()=>setOverlay(null)} connectedBanks={connectedBanks} totalBalance={totalBalance} transactions={transactions}/>}
                        {overlay==="weather"&&<WeatherWarnings onClose={()=>setOverlay(null)}/>}
                      </div>
                    )}
                    {(overlay==="add"||overlay==="expense"||overlay==="income")&&<SwipeClose onClose={()=>setOverlay(null)} className="absolute inset-0 z-30"><AddTransaction initialType={overlay==="income"?"income":"expense"} onClose={()=>setOverlay(null)} onAdd={addTransaction}/></SwipeClose>}
                    {overlay==="goal_quick"&&<SwipeClose onClose={()=>setOverlay(null)} className="absolute inset-0 z-30"><AddGoalSheet onSave={g=>{setGoals(p=>[...p,g]);setOverlay(null);}} onClose={()=>setOverlay(null)}/></SwipeClose>}
                    {addMenuOpen&&<QuickAddMenu onClose={()=>setAddMenuOpen(false)} onExpense={()=>{setAddMenuOpen(false);setOverlay("expense");}} onIncome={()=>{setAddMenuOpen(false);setOverlay("income");}} onGoal={()=>{setAddMenuOpen(false);setOverlay("goal_quick");}}/>}
                    {overlay==="updates"&&<SwipeClose onClose={()=>setOverlay(null)} className="absolute inset-0 z-40"><UpdatesSheet onClose={()=>setOverlay(null)}/></SwipeClose>}
                    <SideMenu open={menuOpen} onClose={()=>setMenuOpen(false)} go={go} dark={dark} setDark={setDark} onCheckUpdate={()=>showToast("You're on the latest version ✓")}/>
                    {toast&&<div className="absolute bottom-4 left-1/2 z-50 -translate-x-1/2 whitespace-nowrap rounded-full bg-slate-900 px-5 py-3 text-sm font-semibold text-white shadow-xl">{toast}</div>}
                  </div>
                  {/* Dock is a real flex footer — no fixed positioning, no gap */}
                  <DockNav onAdd={()=>setAddMenuOpen(p=>!p)} addOpen={addMenuOpen} onInsights={()=>setOverlay("insights")}/>
                </TabCtx.Provider>
              )}
            </>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<ForecastContainer/>);
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=44');
    }
  </script>
</body>
</html>
