<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Updating CashCycle…</title>
  <style>
    body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;
    font-family:-apple-system,sans-serif;background:#2ecc5f;color:#fff;gap:16px;}
    .spin{font-size:64px;animation:spin 1s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    p{font-size:18px;font-weight:700;margin:0;}
    small{font-size:13px;opacity:0.7;}
  </style>
</head>
<body>
  <div class="spin">☀️</div>
  <p>Updating CashCycle…</p>
  <small>This takes 3 seconds</small>
  <script>
    (async function(){
      try{
        if(window.caches){
          const keys=await caches.keys();
          await Promise.all(keys.map(k=>caches.delete(k)));
        }
        if(navigator.serviceWorker){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r=>r.unregister()));
        }
      }catch(e){}
      setTimeout(()=>{ location.replace('/cashcycle/'); },2500);
    })();
  </script>
</body>
</html>
